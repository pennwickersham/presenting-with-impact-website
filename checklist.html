<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Talk preparation checklist</title><link href="experience.css" rel="stylesheet"/><style>body{font:18px/1.75 Georgia,serif;background:#faf8f3;color:#182c40;margin:0}.experience{max-width:780px}a{color:#235d69}</style></head><body><main><section class="experience" id="try-it"><p class="eyebrow">Explore before you choose</p><h1>Your next talk: a preparation checklist</h1><p>Original companion worksheet for Presenting with Impact.</p><p><label><input type="checkbox"/> Name the audience and what they already know.</label></p><p><label><input type="checkbox"/> Write the one idea you want remembered.</label></p><p><label><input type="checkbox"/> State the action or decision you want.</label></p><p><label><input type="checkbox"/> Choose one example that makes the idea concrete.</label></p><p><label><input type="checkbox"/> Give each slide one job.</label></p><p><label><input type="checkbox"/> Rehearse aloud and time the talk.</label></p><p><label><input type="checkbox"/> Prepare for the hardest likely question.</label></p><p><label><input type="checkbox"/> Test sound, screen sharing and a backup plan.</label></p><p><label><input type="checkbox"/> Finish with a clear next step.</label></p><p><label><input type="checkbox"/> Send a useful follow-up.</label></p><button onclick="window.print()">Print or save as PDF</button><p><a href="/">Back to the book</a></p></section></main></body></html>
